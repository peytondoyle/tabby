name: TabbyApp
options:
  bundleIdPrefix: com.peytondoyle
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: 3RP42MC533
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"

packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: "1.0.0"

targets:
  TabbyApp:
    type: application
    platform: iOS
    entitlements:
      path: TabbyApp/TabbyApp.entitlements
    sources:
      - path: Tabby/Sources/Tabby
        excludes:
          - "App/TabbyApp.swift"
          - "Resources/Info.plist"
      - path: TabbyApp
    resources:
      - path: Tabby/Sources/Tabby/Resources/Fonts
        type: folder
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peytondoyle.tabby
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        INFOPLIST_FILE: TabbyApp/Info.plist
    info:
      path: TabbyApp/Info.plist
      properties:
        CFBundleDisplayName: Tabby
        CFBundleName: Tabby
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Tabby needs camera access to scan receipts"
        LSApplicationQueriesSchemes:
          - venmo
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.peytondoyle.tabby
            CFBundleURLSchemes:
              - tabby

schemes:
  TabbyApp:
    build:
      targets:
        TabbyApp: all
    run:
      config: Debug
